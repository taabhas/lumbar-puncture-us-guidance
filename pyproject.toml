[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lpguide"
version = "1.0.0"
description = "Ultrasound image guidance and safe needle-trajectory planning for lumbar puncture using an MRI ground truth"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Aabha Tamhankar" },
  { name = "Christopher Nycz" },
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "opencv-python-headless>=4.8"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["lpguide"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
